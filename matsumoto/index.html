<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>著名人検索システム — Sidebar App</title>
<style>
  :root{
    --bg: #0f1724;       /* 深めの夜色 */
    --panel: #161e2e;    /* サイド/パネル（少し明るく） */
    --card: #1e293b;     /* カード背景 */
    --text-main: #f1f5f9;
    --muted: #94a3b8;
    --accent: #10b981;   /* エメラルドグリーン */
    --accent-hover: #059669;
    --danger: #ef4444;
    --glass: rgba(255, 255, 255, 0.05);
    --border: rgba(255, 255, 255, 0.1);
    --radius: 12px;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    color-scheme: dark;
  }
  
  * { box-sizing: border-box; }
  
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--text-main);
    line-height: 1.5;
  }

  /* Layout */
  .app {
    display: grid;
    grid-template-columns: 280px 1fr; /* サイドバーを少し広く */
    gap: 24px;
    padding: 24px;
    max-width: 1400px;
    margin: 0 auto;
    height: 100vh;
    align-items: start;
  }

  /* Sidebar */
  .sidebar {
    background: var(--panel);
    border-radius: var(--radius);
    padding: 20px;
    height: calc(100vh - 48px);
    overflow-y: auto;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
  }

  .brand {
    font-weight: 800;
    font-size: 1.2rem;
    margin-bottom: 24px;
    color: var(--accent);
    letter-spacing: 0.05em;
  }

  .section { margin-bottom: 24px; }
  
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 8px;
  }

  /* スタイリッシュなセレクトボックス */
  select {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: inherit;
    font-size: 0.9rem;
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s;
  }
  select:focus { border-color: var(--accent); }
  select:disabled { opacity: 0.6; cursor: not-allowed; }

  /* Buttons */
  button { font-family: inherit; transition: all 0.2s; }
  
  button.primary {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #022c22;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2);
  }
  button.primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
  button.primary:active { transform: translateY(0); }

  .action-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .small-btn, .small2-btn {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.9rem;
    border: 1px solid var(--border);
  }
  
  .small-btn { background: transparent; color: var(--muted); }
  .small-btn:hover { background: var(--glass); color: var(--text-main); }
  
  .small2-btn { background: #3b82f6; color: white; border: none; }
  .small2-btn:hover { background: #2563eb; }

  /* History List */
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 400px; /* 長くなりすぎないようにスクロール */
    overflow-y: auto;
  }
  
  .history-item {
    padding: 10px;
    border-radius: 8px;
    background: var(--glass);
    font-size: 0.9rem;
    color: var(--text-main);
    display: flex;
    align-items: flex-start;
    line-height: 1.4;
  }
  
  .history-item .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.7rem;
    font-weight: 700;
    margin-right: 10px;
    margin-top: 2px;
    min-width: 45px;
    text-align: center;
  }
  .tag-yes { background: rgba(16, 185, 129, 0.2); color: var(--accent); }
  .tag-no { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
  .tag-dk { background: rgba(148, 163, 184, 0.2); color: var(--muted); }

  /* Main Area */
  .main {
    padding: 32px;
    border-radius: var(--radius);
    background: var(--panel);
    border: 1px solid var(--border);
    height: calc(100vh - 48px);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    position: relative;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 30px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
  }
  
  .title { font-size: 1.5rem; font-weight: 800; }
  .meta { font-size: 0.9rem; color: var(--muted); font-family: monospace; }

  /* Question Area */
  .question-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 200px;
  }

  .question-box {
    width: 100%;
    max-width: 800px;
    padding: 40px;
    border-radius: 16px;
    background: linear-gradient(145deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    border: 1px solid var(--border);
    text-align: center;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
  }
  
  .question-text {
    font-size: 1.6rem;
    font-weight: 700;
    line-height: 1.5;
    color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  }

  /* Guess Card */
  .guess-card {
    background: var(--bg);
    padding: 24px;
    border-radius: 16px;
    border: 1px solid var(--accent);
    box-shadow: 0 0 30px rgba(16, 185, 129, 0.1);
    text-align: center;
    max-width: 360px;
    margin: 0 auto;
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  .guess-card img {
    width: 100%;
    height: 240px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 16px;
    background: #000;
  }
  
  .guess-name { font-size: 1.8rem; font-weight: 800; color: var(--accent); margin-bottom: 8px; }
  .guess-sub { color: var(--muted); }

  /* Candidates Grid (ここを大きく変更) */
  #candidates-list {
    display: none; /* JSでflex/grid切り替え制御 */
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); /* タイル状に並べる */
    gap: 16px;
    padding: 10px 0;
    width: 100%;
  }

  .candidate-card {
    background: var(--card);
    padding: 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    gap: 12px;
  }
  
  .candidate-card:hover {
    transform: translateY(-4px);
    background: #2d3748;
    border-color: var(--accent);
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
  }

  .candidate-card img {
    width: 80px;
    height: 80px;
    border-radius: 50%; /* 丸くする */
    object-fit: cover;
    border: 2px solid var(--border);
  }

  .candidate-name {
    font-size: 0.95rem;
    font-weight: 600;
    line-height: 1.3;
  }

  /* Controls (Big Buttons) */
  .controls {
    display: flex;
    gap: 16px;
    margin-top: auto; /* 下部に固定気味に */
    padding-top: 24px;
  }
  
  .btn-large {
    flex: 1;
    padding: 20px;
    border-radius: 12px;
    border: none;
    font-weight: 800;
    font-size: 1.2rem;
    cursor: pointer;
    transition: transform 0.1s, filter 0.2s;
    display: flex;
    justify-content: center;
    align-items: center;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  
  .btn-large:hover { filter: brightness(1.1); }
  .btn-large:active { transform: scale(0.98); }
  
  .btn-yes { background: var(--accent); color: #022c22; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
  .btn-dk { background: var(--card); border: 1px solid var(--border); color: var(--muted); }
  .btn-no { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: var(--danger); }
  .btn-no:hover { background: rgba(239, 68, 68, 0.25); }

  /* Slide Panel (Memory) */
  .slide-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 400px;
    height: 100%;
    background: rgba(15, 23, 36, 0.95); /* 半透明 */
    backdrop-filter: blur(10px);
    z-index: 2000;
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: -10px 0 30px rgba(0,0,0,0.5);
    border-left: 1px solid var(--border);
  }
  .slide-panel.open { transform: translateX(0); }
  
  .slide-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    border-bottom: 1px solid var(--border);
    font-weight: 700;
  }

  .memory-screen-list {
    padding: 20px;
    overflow-y: auto;
    height: calc(100% - 70px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Responsive */
  @media(max-width: 900px){
    .app { grid-template-columns: 1fr; padding: 16px; gap: 16px; height: auto; }
    .sidebar { height: auto; max-height: 300px; }
    .main { height: auto; min-height: 60vh; }
    .slide-panel { width: 100%; }
    .question-text { font-size: 1.3rem; }
    #candidates-list { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  }

  /* Loader */
  .loader { height: 4px; background: var(--glass); border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
  .loader > .bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.2s; box-shadow: 0 0 10px var(--accent); }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">🚀 著名人検索システム</div>

    <div class="section">
      <label for="dataset-select">使用するデータセット</label>
      <select id="dataset-select" disabled>
        <option>読み込み中...</option>
      </select>
      
      <div style="height:16px"></div>
      
      <button class="primary" id="start-btn">▶ ゲーム開始</button>
      
      <div style="height:12px"></div>
      
      <div class="action-buttons">
        <button class="small-btn" id="undo-btn">↩ 1つ戻る</button>
        <button class="small2-btn" id="memory-btn">🧠 記憶一覧</button>
      </div>
    </div>

    <div id="saved-people-container" style="background:var(--bg); padding:12px; margin-top:10px; border-radius:8px; border:1px solid var(--border); display:none;">
      <label>今回覚えた人物</label>
      <div id="saved-list" class="history-list"></div>
    </div>

    <div class="section" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
      <label>回答の履歴</label>
      <div class="history-list" id="history-list"></div>
    </div>

    <div style="margin-top:10px; font-size:0.75rem; color:var(--muted); text-align: right;">
      API: <span id="api-host">--</span>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="title">Akinator Clone</div>
        <div class="meta">あなたが思い浮かべた人物を当ててみせます</div>
      </div>
      <div class="meta" id="stat-text" style="background:var(--bg); padding:8px 16px; border-radius:20px; border:1px solid var(--border);">
        候補: - 人 · Step: 0
      </div>
    </div>

    <div class="loader" id="loader" style="display:none"><div class="bar" id="loader-bar"></div></div>

    <div class="question-area">
      <div class="question-box" id="question-box">
        <div class="question-text" id="question-text">👈 左のメニューからデータセットを選んで<br>「ゲーム開始」を押してください。</div>
      </div>

      <div class="guess-card" id="guess-card" style="display:none">
        <div style="font-size:0.9rem; color:var(--accent); margin-bottom:8px; font-weight:700;">私の推測は...</div>
        <img id="guess-img" src="" alt="人物画像" onerror="this.style.display='none'" />
        <div class="guess-name" id="guess-name">--</div>
        <div class="guess-sub" id="guess-sub">この人物で合っていますか？</div>
      </div>
    </div>

    <div id="candidates-header" style="display:none; text-align:center; font-size:1.1rem; font-weight:700; margin:20px 0; color:var(--text-main);">
      🤔 もしかして、この中にいますか？
    </div>
    
    <div id="candidates-list"></div>

    <div class="controls">
      <button class="btn-large btn-yes" id="btn-yes">YES (はい)</button>
      <button class="btn-large btn-dk" id="btn-dk">??? (微妙)</button>
      <button class="btn-large btn-no" id="btn-no">NO (いいえ)</button>
    </div>
  </main>
</div>

<div id="memory-screen" class="slide-panel">
  <div class="slide-header">
    <span id="slide-title">🧠 記憶した人物リスト</span>
    <button id="memory-close" class="small-btn" style="width:auto; padding:6px 12px;">閉じる</button>
  </div>

  <div id="memory-screen-list" class="memory-screen-list"></div>
</div>


<script>
  const API = 'http://127.0.0.1:5000';
  document.getElementById('api-host').innerText = API;

  let currentQuestionKey = null;
  let isGuessing = false;
  let historyLog = [];
  const rememberedPeople = [];
  let lastGuessData = null; // 推測データを保持

  function startLoading(){
    document.getElementById('loader').style.display = 'block';
    document.getElementById('loader-bar').style.width = '10%';
    clearInterval(window._loadInt);
    let p = 10;
    window._loadInt = setInterval(()=>{ p = Math.min(90, p + Math.random()*6); document.getElementById('loader-bar').style.width = p + '%'; if(p>=90) clearInterval(window._loadInt); }, 160);
  }

  function stopLoading(){
    clearInterval(window._loadInt);
    document.getElementById('loader-bar').style.width = '100%';
    setTimeout(()=>{ document.getElementById('loader').style.display = 'none'; }, 220);
  }

  async function loadDatasets(){
    startLoading();
    try{
      const res = await fetch(`${API}/datasets`);
      const data = await res.json();
      const sel = document.getElementById('dataset-select');
      sel.innerHTML='';
      if(!data || !Array.isArray(data.datasets) || data.datasets.length===0){
        const opt = document.createElement('option'); opt.text = 'データセットが見つかりません'; sel.add(opt); sel.disabled=true; return;
      }
      data.datasets.forEach(d=>{
        const opt = document.createElement('option'); 
        opt.value=d.id; 
        opt.text = `${d.label} (${new Date(d.mtime*1000).toLocaleDateString()})`; 
        if(d.is_default) opt.selected=true; 
        sel.add(opt);
      });
      sel.disabled=false;
    }catch(e){ console.error(e); alert('データセットの読み込みに失敗しました'); }
    finally{ stopLoading(); }
  }

  function pushHistory(text, ans){
    historyLog.push({question:text, answer:ans});
    renderHistory();
  }

  function renderHistory(){
    const list = document.getElementById('history-list'); list.innerHTML='';
    historyLog.slice().reverse().forEach(h=>{
      const div = document.createElement('div'); div.className='history-item';
      const tag = document.createElement('span');
      tag.className = 'tag ' + (h.answer==='yes'? 'tag-yes': h.answer==='no' ? 'tag-no' : 'tag-dk');
      tag.textContent = h.answer==='yes'? 'Y' : h.answer==='no' ? 'N' : '?';
      
      const t = document.createElement('span'); 
      t.textContent = h.question; 
      div.appendChild(tag);
      div.appendChild(t);
      list.appendChild(div);
    });
  }

  async function startGame(){
    historyLog = []; renderHistory();
    const dsId = document.getElementById('dataset-select').value;
    startLoading();
    try{
      const res = await fetch(`${API}/start`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({dataset_id: dsId})});
      const data = await res.json(); render(data);
    }catch(e){ console.error(e); alert('エラーが発生しました'); }
    finally{ stopLoading(); }
  }

  function showSavedMessage(name) {
    const qBox = document.getElementById('question-box');
    const guessCard = document.getElementById('guess-card');

    guessCard.style.display = 'none';
    qBox.style.display = 'flex';
    document.getElementById('question-text').innerHTML = `<span style="color:var(--accent)">🎉 "${name}"</span> を<br>記憶に保存しました！`;
  }

  function addSavedPerson(name) {
    const area = document.getElementById('saved-list');
    const div = document.createElement('div');
    div.className = 'history-item';
    div.innerText = name;
    area.appendChild(div);
    document.getElementById('saved-people-container').style.display = 'block';
  }

  function renderMemoryScreen() {
    const area = document.getElementById('memory-screen-list');
    area.innerHTML = '';

    rememberedPeople.forEach(p => {
      const card = document.createElement('div');
      card.className = 'candidate-card'; 
      card.style.flexDirection = 'row'; // リスト形式で見やすく
      card.style.textAlign = 'left';

      card.addEventListener('click', () => {
        if (p.source_url) { window.open(p.source_url, '_blank'); }
      });

      if (p.image_url) {
        const img = document.createElement('img');
        img.src = p.image_url;
        img.style.width = '60px'; img.style.height = '60px';
        card.appendChild(img);
      } else {
        // 画像がない場合のダミー
        const dummy = document.createElement('div');
        dummy.style.width='60px'; dummy.style.height='60px'; dummy.style.background='#333'; dummy.style.borderRadius='50%';
        card.appendChild(dummy);
      }

      const name = document.createElement('div');
      name.className = 'candidate-name';
      name.innerText = p.name;
      name.style.flex = '1';

      card.appendChild(name);
      area.appendChild(card);
    });
  }

  async function sendAnswer(ans){
    console.log("sendAnswer", ans, "isGuessing:", isGuessing);

    // 推測モードでYESなら記憶に追加
    if(isGuessing && ans==='yes'){
      if(lastGuessData){
          rememberedPeople.push({
            name: lastGuessData.name,
            image_url: lastGuessData.image_url,
            source_url: lastGuessData.source_url
          });
          renderMemoryScreen();
          addSavedPerson(lastGuessData.name);
          showSavedMessage(lastGuessData.name);
          toggleControls(false);
      }
      return;
    }

    if(!isGuessing && currentQuestionKey){
      const qText = document.getElementById('question-text').innerText;
      pushHistory(qText, ans);
    }

    try{
      startLoading();
      const res = await fetch(`${API}/answer`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({answer:ans, question_key: currentQuestionKey})});
      const data = await res.json();
      stopLoading();
      render(data);
    }catch(e){ console.error(e); stopLoading(); }
  }

  async function undo(){
    try{
      const res = await fetch(`${API}/undo`, {method:'POST'});
      const data = await res.json();
      if(historyLog.length) historyLog.pop(); renderHistory();
      render(data);
    }catch(e){ console.error(e); }
  }

  // 候補一覧を描画 (Grid対応)
  function renderCandidatesList(list) {
    const area = document.getElementById("candidates-list");
    const header = document.getElementById("candidates-header");

    // CSS Gridを使うため display: grid
    area.innerHTML = "";
    area.style.display = "grid"; 

    header.style.display = "block";
    header.innerText = `🤔 この中に思い浮かべた人物はいますか？`;

    toggleControls(false);

    document.getElementById('guess-card').style.display = 'none';
    document.getElementById('question-box').style.display = 'none';

    list.forEach(c => {
        const card = document.createElement("div");
        card.className = "candidate-card";
        
        card.addEventListener("click", () => {
            chooseCandidate(c.name);
        });

        // 画像取得ロジックがない場合でもレイアウト崩れないように
        // (本来はAPIから画像URLがあれば入れたいところですが、現状candidatesにはnameしかない場合が多いので名前のみ表示)
        // もしデータに画像があればここに追加できます
        
        // ダミーアイコン（イニシャル）
        const initial = c.name.charAt(0);
        const icon = document.createElement("div");
        icon.style.width="60px"; icon.style.height="60px"; 
        icon.style.background="var(--bg)"; icon.style.borderRadius="50%";
        icon.style.display="flex"; icon.style.alignItems="center"; icon.style.justifyContent="center";
        icon.style.fontWeight="bold"; icon.style.border="1px solid var(--border)";
        icon.innerText = initial;
        card.appendChild(icon);

        const name = document.createElement("div");
        name.className = "candidate-name";
        name.innerText = c.name;

        card.appendChild(name);
        area.appendChild(card);
    });
  }

  function chooseCandidate(name) {
    document.getElementById("candidates-list").style.display = "none";
    document.getElementById("candidates-header").style.display = "none";
    startLoading();

    fetch(API + "/answer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ answer: "force_choose", person_name: name })
    })
    .then(res => res.json())
    .then(data => {
      stopLoading();
      render(data);
    })
    .catch(err => {
      stopLoading();
      console.error(err);
    });
  }

  function render(data) {
    if (!data) return;

    if (data.stats) {
      document.getElementById('stat-text').innerText =
          `候補: ${data.stats.candidates_count}人 · Step: ${data.stats.steps}`;
      document.getElementById('stat-candidates').innerText =
          `候補: ${data.stats.candidates_count}`;
      document.getElementById('stat-steps').innerText =
          `Step: ${data.stats.steps}`;
    }

    const qBox = document.getElementById('question-box');
    const qText = document.getElementById('question-text');
    const guessCard = document.getElementById('guess-card');
    const cList = document.getElementById("candidates-list");
    const cHeader = document.getElementById("candidates-header");

    // リセット
    cList.style.display = "none";
    cHeader.style.display = "none";

    // === 通常の質問 ===
    if (data.type === "question") {
      isGuessing = false;
      currentQuestionKey = data.key;
      qBox.style.display = "flex";
      guessCard.style.display = "none";
      qText.innerText = data.text;
      toggleControls(true);
      return;
    }

    // === 推測（1人の時） ===
    if (data.type === "guess") {
      isGuessing = true;
      currentQuestionKey = null;

      lastGuessData = {
        name: data.name,
        image_url: data.image_url,
        source_url: data.source_url
      };

      qBox.style.display = "none";
      guessCard.style.display = "block"; // block or flex

      document.getElementById('guess-name').innerText = data.name || "—";
      const img = document.getElementById("guess-img");
      if (data.image_url) {
        img.src = data.image_url;
        img.style.display = "block";
      } else {
        img.style.display = "none";
      }
      toggleControls(true);
      return;
    }

    // === 候補一覧 ===
    if (data.type === "candidates_list") {
      renderCandidatesList(data.candidates);
      toggleControls(false);
      return;
    }
  }

  function toggleControls(enabled){
    document.getElementById('btn-yes').disabled = !enabled;
    document.getElementById('btn-dk').disabled = !enabled;
    document.getElementById('btn-no').disabled = !enabled;
    
    // 見た目上の無効化
    const opacity = enabled ? '1' : '0.4';
    const cursor = enabled ? 'pointer' : 'not-allowed';
    
    ['btn-yes', 'btn-dk', 'btn-no'].forEach(id => {
        const btn = document.getElementById(id);
        btn.style.opacity = opacity;
        btn.style.cursor = cursor;
    });
  }

  // Bind UI
  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('undo-btn').addEventListener('click', undo);
  
  document.getElementById('btn-yes').addEventListener('click', ()=> sendAnswer('yes'));
  document.getElementById('btn-no').addEventListener('click', ()=> sendAnswer('no'));
  document.getElementById('btn-dk').addEventListener('click', ()=> sendAnswer('dont_know'));

  // init
  window.addEventListener('load', ()=>{ loadDatasets(); toggleControls(false); });

  const memoryBtn = document.getElementById('memory-btn');
  const memoryScreen = document.getElementById('memory-screen');
  const memoryClose = document.getElementById('memory-close');

  if (memoryBtn && memoryScreen && memoryClose) {
    memoryBtn.addEventListener('click', () => {
      // 一応同期とるならここでrenderMemoryScreen呼ぶのもあり
      renderMemoryScreen(); 
      memoryScreen.classList.add('open');
    });
    memoryClose.addEventListener('click', () => {
      memoryScreen.classList.remove('open');
    });
  }
</script>

</body>
</html>
