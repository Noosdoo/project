<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>じゃんけんゲーム</title>
<style>
  :root { --bg:#0b1020; --fg:#e8ecff; --muted:#9aa3c7; --acc:#6aa6ff; }
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:radial-gradient(1200px 800px at 50% -200px,#1a2448 0,var(--bg) 55%);color:var(--fg)}
  .wrap{max-width:720px;margin:48px auto;padding:0 16px}
  .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);backdrop-filter: blur(6px);border-radius:20px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  h1{margin:0 0 6px;font-size:28px} .muted{color:var(--muted);font-size:13px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  button{appearance:none;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:var(--fg);padding:12px 16px;border-radius:14px;cursor:pointer;font-weight:600;transition:.15s}
  button:hover{transform:translateY(-1px);background:rgba(255,255,255,.14)}
  .choice{flex:1;min-width:120px;font-size:18px}
  .score{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;margin-top:12px}
  .score div{padding:10px;border:1px dashed rgba(255,255,255,.2);border-radius:12px}
  .result{font-size:28px;font-weight:800;margin:10px 0;color:#b5d1ff}
  .log{max-height:180px;overflow:auto;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;font-family:ui-monospace,monospace;background:rgba(0,0,0,.25)}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.2);font-size:12px;color:var(--muted)}
  .danger{border-color:#ff6b6b;color:#ffb3b3}
  .ok{border-color:#79ffb2;color:#c2ffd8}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>著名人検索システム</h1>
      <div class="muted">これから <b id="goal">5</b> つの質問のYES/NOで著名人を特定します。</div>

      <div class="row" style="margin-top:12px">
        <span class="pill">著名人検索</span>
        <button class="pill" data-level="easy">YES</button>
        <button class="pill" data-level="normal">UNKNOWN</button>
        <button class="pill danger" data-level="hard">NO</button>
        <span style="flex:1"></span>
        <button id="reset" class="pill ok">リセット</button>
      </div>

      <div class="score">
        <div>YES<br><b id="ps">0</b></div>
        <div>ラウンド<br><b id="rd">1</b></div>
        <div>NO<br><b id="cs">0</b></div>
      </div>

      <div class="result" id="result">質問に応じる( ｀ー´)ノ</div>
      <img id="image_place" src="" alt="" style="display:block;margin:12px auto;max-width:300px;border-radius:12px;">

      <div class="row">
        <button class="choice" data-hand="rock">YES</button>
        <button class="choice" data-hand="scissors">UNKNOWN</button>
        <button class="choice" data-hand="paper">NO</button>
      </div>

      <div style="margin-top:12px" class="log" id="log" aria-live="polite"></div>
    </div>
  </div>

<script>
(() => {
  const hands = ["rock","scissors","paper"];
  const labels = {rock:"ちがう",scissors:"わからない",paper:"そう"};
  const beats  = {rock:"scissors", scissors:"paper", paper:"rock"};

  let player=0, cpu=0, round=1, goal=5, level="normal"; // normal/easy/hard

  const el = {
    ps: qs("#ps"), cs: qs("#cs"), rd: qs("#rd"),
    res: qs("#result"), log: qs("#log"), goal: qs("#goal"),
    choices: qsa(".choice"), reset: qs("#reset"), levelBtns: qsa('[data-level]')
  };

  function qs(s){ return document.querySelector(s) }
  function qsa(s){ return Array.from(document.querySelectorAll(s)) }

  function cpuPick(playerHand){
    // 難易度でCPUの賢さを変える
    if(level==="easy"){
      // たまに自滅
      const r = Math.random();
      if(r<0.5) return hands[Math.floor(Math.random()*3)];
      // 50%でわざと負ける
      return beats[playerHand]; // プレイヤーの手に負ける手
    }
    if(level==="hard"){
      // 60%で勝ちに行く
      const r = Math.random();
      if(r<0.6){
        // プレイヤーに勝てる手
        return Object.entries(beats).find(([h,b]) => b===playerHand)[0];
      }
      return hands[Math.floor(Math.random()*3)];
    }
    // normal: ランダム
    return hands[Math.floor(Math.random()*3)];
  }

  function play(playerHand){
    if(finished()) return;
    const cpuHand = cpuPick(playerHand);
    let outcome = "draw";
    if(beats[playerHand]===cpuHand) outcome="win";
    else if(beats[cpuHand]===playerHand) outcome="lose";

    if(outcome==="win") player++;
    else if(outcome==="lose") cpu++;

    el.ps.textContent = player;
    el.cs.textContent = cpu;
    el.rd.textContent = ++round;

    const msg = `あなた:${labels[playerHand]}  ${outcome==="win"?"だよな( ..)φメモメモ":outcome==="lose"?"違うんかい😒":"分からないですか"}`
    el.res.textContent = msg;
    el.log.innerHTML = `<div>R${round-1}: ${msg}</div>` + el.log.innerHTML;

    if(finished()){
      const who = player>cpu ? "阿佐ヶ谷姉妹ですね" : "中山きんに君ですね";
      el.res.textContent = `${who} もう一度やる？`;
      let img = document.getElementById("image_place");
img.src = "muscle.png";
    }
  }

  function finished(){ return player>=goal || cpu>=goal }

  function reset(){
    player=cpu=0; round=1;
    el.ps.textContent=0; el.cs.textContent=0; el.rd.textContent=1; el.log.innerHTML="";
    el.res.textContent="質問に応じる( ｀ー´)ノ";
    document.getElementById("image_place").src = "";
  }


  // events
  el.choices.forEach(b => b.addEventListener("click", () => play(b.dataset.hand)));
  el.reset.addEventListener("click", reset);
  el.levelBtns.forEach(b => b.addEventListener("click", () => {
    level = b.dataset.level;
    reset();
  }));

  // 初期
  el.goal.textContent = goal;
})();
</script>
</body>
</html>
