<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AI Akinator Clone</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    /* ★ライトテーマ設定★ */
    --bg-color: #f8fafc;       /* 背景色：ほんのり青みがかった白 */
    --card-bg: #ffffff;        /* カード色：真っ白 */
    --text-main: #1e293b;      /* 文字色：濃い紺グレー */
    --text-sub: #64748b;       /* 補足文字：薄いグレー */
    --border: #e2e8f0;         /* 枠線：薄いグレー */
    --shadow: 0 10px 40px rgba(0,0,0,0.08); /* 柔らかい影 */
  }

  body {
    margin: 0; font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg-color);
    color: var(--text-main);
    display: flex; justify-content: center; align-items: center; min-height: 100vh;
  }

  .card {
    background: var(--card-bg);
    padding: 40px; border-radius: 24px;
    width: 90%; max-width: 600px; text-align: center;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }

  h1 { 
    /* タイトルは少しグラデーションを残してアクセントに */
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 0 0 10px 0; 
  }

  header div { color: var(--text-sub); font-weight: bold; }

  .question { 
    font-size: 1.5rem; font-weight: bold; margin: 30px 0; min-height: 80px; 
    color: var(--text-main);
  }
  
  /* プルダウンのスタイル（白背景用） */
  select {
    padding: 12px; font-size: 1rem; border-radius: 10px;
    background: #f1f5f9; color: var(--text-main); 
    border: 1px solid #cbd5e1;
    margin-bottom: 20px; width: 80%; cursor: pointer; outline: none;
  }
  option { background: white; color: black; }

  button {
    border: none; padding: 15px 30px; border-radius: 50px;
    font-size: 1rem; font-weight: bold; cursor: pointer; margin: 5px;
    transition: all 0.2s; color: white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  button:active { transform: scale(0.95); }
  button:hover { filter: brightness(1.05); transform: translateY(-2px); }

  .btn-yes { background: #10b981; }
  .btn-no { background: #ef4444; }
  .btn-unk { background: #64748b; }
  
  /* スタートボタン：青系 */
  .btn-start { background: linear-gradient(135deg, #3b82f6, #6366f1); font-size: 1.5rem; padding: 20px 60px; }
  
  /* 戻るボタン：枠線のみ */
  .btn-undo {
    background: transparent; border: 1px solid #94a3b8; 
    color: #64748b; font-size: 0.8rem; box-shadow: none;
  }
  .btn-undo:hover { background: #f1f5f9; color: #334155; }

  .hidden { display: none; }
  
  img { 
    max-width: 200px; border-radius: 15px; margin: 20px 0; 
    box-shadow: 0 10px 25px rgba(0,0,0,0.15); 
  }
</style>
</head>
<body>

<div class="card">
  <header>
    <h1>AI GUESSER</h1>
    <div>Turn <span id="step">0</span></div>
  </header>

  <div id="game-area">
    <div id="start-screen">
      <p style="color:#64748b">データセットを選択してください</p>
      
      <select id="dataset-select">
        <option>読み込み中...</option>
      </select>
      <br>

      <button onclick="startGame()" class="btn-start">GAME START</button>
    </div>

    <div id="play-screen" class="hidden">
      <div class="question" id="q-text">質問読み込み中...</div>
      <div>
        <button class="btn-yes" onclick="answer('yes')">YES</button>
        <button class="btn-unk" onclick="answer('dont_know')">???</button>
        <button class="btn-no" onclick="answer('no')">NO</button>
      </div>
      <div style="margin-top:20px">
        <button onclick="undo()" class="btn-undo">1つ戻る</button>
      </div>
    </div>

    <div id="result-screen" class="hidden">
      <div id="result-content"></div>
      <button onclick="location.reload()" class="btn-start" style="font-size:1rem; margin-top:20px">もう一度遊ぶ</button>
    </div>
  </div>
</div>

<script>
const API_BASE = "http://127.0.0.1:5001";
let currentKey = null;

// 起動時にデータセット一覧を取得
window.onload = async function() {
  const data = await api('/datasets', {}, 'GET');
  if (data && data.datasets) {
    const select = document.getElementById('dataset-select');
    select.innerHTML = ''; // クリア
    
    if (data.datasets.length === 0) {
       select.innerHTML = '<option>データファイルがありません</option>';
       return;
    }

    data.datasets.forEach(ds => {
      const option = document.createElement('option');
      option.value = ds.id;
      option.textContent = ds.label;
      select.appendChild(option);
    });
  }
};

async function api(path, body={}, method='POST') {
  try {
    const options = {
      method: method,
      headers: {'Content-Type': 'application/json'}
    };
    if (method !== 'GET') {
      options.body = JSON.stringify(body);
    }
    
    const res = await fetch(API_BASE + path, options);
    if(!res.ok) throw new Error(await res.text());
    return await res.json();
  } catch(e) {
    alert("エラー: " + e.message);
  }
}

async function startGame() {
  const select = document.getElementById('dataset-select');
  const selectedId = select.value;
  const data = await api('/start', { dataset_id: selectedId });
  if(data) updateUI(data);
}

async function answer(ans) {
  const data = await api('/answer', { answer: ans, question_key: currentKey });
  if(data) updateUI(data);
}

async function undo() {
  const data = await api('/undo');
  if(data && data.undo) updateUI(data);
}

function updateUI(data) {
  document.getElementById('start-screen').classList.add('hidden');
  
  if (data.type === 'question') {
    document.getElementById('play-screen').classList.remove('hidden');
    document.getElementById('q-text').textContent = data.question_text;
    document.getElementById('step').textContent = data.session_data.steps;
    currentKey = data.question_key;
    
  } else if (data.type === 'guess') {
    document.getElementById('play-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');
    
    let html = `<h2 style="color:#1e293b; font-size:1.8rem;">推測: ${data.name}</h2>`;
    if(data.image) html += `<img src="${data.image}">`;
    html += `<p style="color:#64748b;">確信度: ${data.confidence}%</p>`;
    document.getElementById('result-content').innerHTML = html;
  }
}
</script>
</body>
</html>
