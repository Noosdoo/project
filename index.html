<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AI Akinator Clone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #0f172a;
    --primary: #3b82f6;
    --accent: #8b5cf6;
    --success: #10b981;
    --danger: #ef4444;
    --text: #f1f5f9;
    --glass: rgba(30, 41, 59, 0.7);
    --glass-border: rgba(255, 255, 255, 0.1);
  }

  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    font-family: 'Noto Sans JP', sans-serif;
    background-color: var(--bg-dark);
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  .container {
    width: 100%;
    max-width: 600px;
    padding: 20px;
    perspective: 1000px;
  }

  .card {
    background: var(--glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 32px 24px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    position: relative;
    overflow: hidden;
    transition: transform 0.3s ease;
  }

  /* ヘッダー周り */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--glass-border);
    padding-bottom: 16px;
  }

  h1 {
    margin: 0;
    font-size: 1.2rem;
    font-weight: 900;
    background: linear-gradient(to right, #60a5fa, #c084fc);
    -webkit-background-clip: text;
    color: transparent;
    letter-spacing: 0.05em;
  }

  .status-badge {
    font-size: 0.8rem;
    padding: 4px 12px;
    border-radius: 99px;
    background: rgba(0,0,0,0.3);
    color: #94a3b8;
  }

  /* メイン表示エリア */
  .display-area {
    min-height: 180px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin-bottom: 32px;
  }

  .question-text {
    font-size: 1.6rem;
    font-weight: 700;
    line-height: 1.4;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    animation: fadeIn 0.5s ease;
  }

  .result-name {
    font-size: 2rem;
    font-weight: 900;
    color: #fbbf24;
    margin-top: 10px;
    animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .guess-image {
    width: 200px;
    height: 200px;
    object-fit: cover;
    border-radius: 20px;
    margin: 20px 0;
    box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
    border: 3px solid rgba(255,255,255,0.2);
    animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  /* 操作ボタン */
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }

  button {
    border: none;
    padding: 16px 8px;
    border-radius: 16px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    color: white;
    position: relative;
    overflow: hidden;
    font-size: 1rem;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none !important;
  }

  button:active { transform: scale(0.96); }
  button:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }

  .btn-yes { background: linear-gradient(135deg, #059669, #10b981); }
  .btn-no { background: linear-gradient(135deg, #dc2626, #ef4444); }
  .btn-unknown { background: linear-gradient(135deg, #475569, #64748b); }
  
  .btn-control {
    background: transparent;
    border: 1px solid var(--glass-border);
    font-size: 0.9rem;
    padding: 8px 16px;
    margin-top: 10px;
    width: 100%;
  }

  /* キーボードヒント */
  .key-hint {
    display: block;
    font-size: 0.7rem;
    opacity: 0.7;
    margin-top: 4px;
    font-weight: 400;
  }

  /* ログエリア */
  .log-area {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--glass-border);
    font-size: 0.85rem;
    color: #94a3b8;
    max-height: 100px;
    overflow-y: auto;
  }
  .log-item { margin-bottom: 4px; }

  /* ローディングオーバーレイ */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 10;
    border-radius: 24px;
  }
  .overlay.active { opacity: 1; pointer-events: all; }
  
  .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid var(--primary);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  /* アニメーション定義 */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* レスポンシブ */
  @media (max-width: 480px) {
    .question-text { font-size: 1.3rem; }
    .card { padding: 24px 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="overlay" id="loading">
      <div class="spinner"></div>
    </div>

    <header>
      <div>
        <h1>AI GUESSER</h1>
        <div style="font-size:0.75rem; color:#94a3b8; margin-top:4px;">Dataset: <span id="dataset-label">Loading...</span></div>
      </div>
      <div class="status-badge">
        Turn <span id="step-count" style="color:white; font-weight:bold;">0</span>
      </div>
    </header>

    <div class="display-area" id="display-area">
      <div class="question-text" id="main-text">Start Gameを押して開始</div>
      </div>

    <div class="actions" id="action-buttons">
      <button class="btn-yes" data-a="yes">
        YES
        <span class="key-hint">[Y]</span>
      </button>
      <button class="btn-unknown" data-a="dont_know">
        UNK
        <span class="key-hint">[U]</span>
      </button>
      <button class="btn-no" data-a="no">
        NO
        <span class="key-hint">[N]</span>
      </button>
    </div>

    <div style="display:flex; gap:10px; margin-top:16px;">
      <button id="undo" class="btn-control">戻る (Undo)</button>
      <button id="reset" class="btn-control" style="background:rgba(255,255,255,0.1); border-color:transparent;">新規開始</button>
    </div>

    <div class="log-area" id="log"></div>
  </div>
</div>

<script>
(() => {
  const API_BASE = "http://127.0.0.1:5001";
  
  // 状態管理
  let gameActive = false;
  let currentQuestionKey = null;

  // 要素
  const el = {
    text: document.getElementById('main-text'),
    display: document.getElementById('display-area'),
    step: document.getElementById('step-count'),
    loading: document.getElementById('loading'),
    log: document.getElementById('log'),
    datasetLabel: document.getElementById('dataset-label'),
    btns: document.querySelectorAll('.actions button'),
    reset: document.getElementById('reset'),
    undo: document.getElementById('undo')
  };

  const setLoading = (isLoading) => {
    el.loading.classList.toggle('active', isLoading);
  };

  const log = (msg) => {
    const div = document.createElement('div');
    div.className = 'log-item';
    div.textContent = `> ${msg}`;
    el.log.prepend(div);
  };

  // API通信
  async function api(endpoint, body = {}) {
    setLoading(true);
    try {
      const res = await fetch(`${API_BASE}${endpoint}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      return await res.json();
    } catch (e) {
      el.text.textContent = "サーバー接続エラー";
      log("Error: " + e.message);
      return null;
    } finally {
      setLoading(false);
    }
  }

  // 初期化: データセット名取得だけしておく（GETリクエスト）
  fetch(`${API_BASE}/datasets`)
    .then(r => r.json())
    .then(d => {
      if(d.datasets.length) el.datasetLabel.textContent = d.datasets[0].label;
    })
    .catch(() => el.datasetLabel.textContent = "Offline");

  // ゲーム開始
  async function startGame() {
    const data = await api('/start', { dataset_id: 'dummy_v2' });
    if (!data) return;
    
    gameActive = true;
    el.log.innerHTML = '';
    updateUI(data);
    log("ゲーム開始");
  }

  // 回答送信
  async function sendAnswer(ans) {
    if (!gameActive) return;
    
    // アニメーションのために一旦テキストを消す（オプション）
    el.text.style.opacity = '0.5';

    const data = await api('/answer', {
      answer: ans,
      question_key: currentQuestionKey
    });
    
    el.text.style.opacity = '1';
    if (data) updateUI(data);
  }

  // 1つ戻る
  async function undo() {
    if (!gameActive) return;
    const data = await api('/undo');
    if (data && data.undo) {
      updateUI(data);
      log("1つ戻りました");
    }
  }

  // 画面更新メインロジック
  function updateUI(data) {
    // 既存の画像があれば削除
    const oldImg = el.display.querySelector('img');
    if (oldImg) oldImg.remove();

    // ステップ数
    if (data.session_data) {
      el.step.textContent = data.session_data.steps;
    }

    if (data.type === 'question') {
      currentQuestionKey = data.question_key;
      el.text.className = 'question-text'; // アニメーション再発火用
      
      // リフローさせてアニメーションをリセットするハック
      void el.text.offsetWidth; 
      
      el.text.innerHTML = data.question_text;
      el.text.style.color = '#f1f5f9';

    } else if (data.type === 'guess') {
      // 推測結果
      currentQuestionKey = null;
      el.text.innerHTML = `<div style="font-size:1rem; color:#94a3b8">私が思うに、それは...</div>
                           <div class="result-name">${data.name}</div>`;
      
      // 画像があれば表示
      if (data.image) { // ← ここでPythonから送った画像URLを使います
        const img = document.createElement('img');
        img.src = data.image;
        img.className = 'guess-image';
        el.display.appendChild(img);
      }
      
      log(`推測: ${data.name} (${data.confidence}%)`);
    }
  }

  // イベントリスナー
  el.reset.addEventListener('click', startGame);
  el.undo.addEventListener('click', undo);
  
  document.querySelectorAll('[data-a]').forEach(btn => {
    btn.addEventListener('click', () => sendAnswer(btn.dataset.a));
  });

  // キーボード操作
  document.addEventListener('keydown', (e) => {
    if (!gameActive) return;
    const key = e.key.toLowerCase();
    if (key === 'y') sendAnswer('yes');
    if (key === 'n') sendAnswer('no');
    if (key === 'u') sendAnswer('dont_know');
  });

  // 初回自動スタートしない（ユーザーに押させる）
})();
</script>
</body>
</html>
