<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>著名人検索システム（ローカル実行）</title>
<style>
  :root { --bg:#0b1020; --fg:#e8ecff; --muted:#9aa3c7; }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:system-ui,Segoe UI,Roboto,sans-serif;
    background:radial-gradient(1200px 800px at 50% -200px,#1a2448 0,var(--bg) 55%);
    color:var(--fg);
  }
  .wrap{max-width:720px;margin:48px auto;padding:0 16px}
  .card{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(6px);
    border-radius:20px;
    padding:20px;
    box-shadow:0 8px 24px rgba(0,0,0,.25)
  }
  h1{margin:0 0 6px;font-size:28px}
  .muted{color:var(--muted);font-size:13px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  button{
    appearance:none;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.08);
    color:var(--fg);
    padding:10px 14px;
    border-radius:14px;
    cursor:pointer;
    font-weight:600;
    font-size:14px;
    transition:.15s;
    white-space:nowrap;
  }
  button:hover{
    transform:translateY(-1px);
    background:rgba(255,255,255,.14)
  }
  button:disabled{
    opacity:0.4;
    cursor:not-allowed;
    transform:none
  }
  .choice{
    flex:1;
    min-width:120px;
    font-size:18px
  }
  .score{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    text-align:center;
    margin-top:12px
  }
  .score div{
    padding:10px;
    border:1px dashed rgba(255,255,255,.2);
    border-radius:12px
  }
  .result{
    font-size:22px;
    font-weight:700;
    margin:14px 0;
    color:#b5d1ff;
    min-height:2em
  }
  .log{
    max-height:180px;
    overflow:auto;
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px;
    padding:10px;
    font-family:ui-monospace,monospace;
    background:rgba(0,0,0,.25)
  }
  img.guess{
    display:block;
    margin:12px auto;
    max-width:320px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.15)
  }
  .pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:6px 12px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.2);
    font-size:12px;
    color:var(--muted);
    background:rgba(0,0,0,.24);
  }
  .ok{
    border-color:#79ffb2;
    color:#c2ffd8;
    background:rgba(0,0,0,.3);
  }
  select{
    background:transparent;
    border:none;
    color:inherit;
    font:inherit;
    padding:2px 0;
    outline:none;
  }
  select option{
    color:#000;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>著名人検索システム（ローカル実行）</h1>
      <div class="muted">YES / UNKNOWN / NO で回答。Pythonサーバーと通信します。</div>

      <!-- データセット選択 -->
      <div class="row" style="margin-top:12px">
        <span class="pill">
          データセット:
          <select id="dataset"></select>
        </span>
      </div>

      <!-- セッション情報 & 操作 -->
      <div class="row" style="margin-top:12px">
        <span class="pill">セッション: <span id="sid">-</span></span>
        <span style="flex:1"></span>
        <button id="undo">1つ戻る</button>
        <button id="reset" class="ok">新規開始</button>
      </div>

      <div class="score">
        <div>YES<br><b id="ps">0</b></div>
        <div>ステップ<br><b id="rd">0</b></div>
        <div>NO<br><b id="cs">0</b></div>
      </div>

      <div class="result" id="result">「新規開始」を押して質問を取得します。</div>
      <img id="image_place" class="guess" src="" alt="" style="display:none">

      <div class="row">
        <button class="choice" data-a="yes">YES</button>
        <button class="choice" data-a="dont_know">UNKNOWN</button>
        <button class="choice" data-a="no">NO</button>
      </div>

      <div style="margin-top:12px" class="log" id="log" aria-live="polite"></div>
    </div>
  </div>

<script>
(() => {
  // ========= APIエンドポイント =========
  const API_BASE   = "http://127.0.0.1:5000";
  const API_START  = `${API_BASE}/start`;
  const API_ANSWER = `${API_BASE}/answer`;
  const API_UNDO   = `${API_BASE}/undo`;
  const API_DATASETS = `${API_BASE}/datasets`;

  // ========= 状態 =========
  let currentQuestionKey = null;
  let gameActive = false;

  // ========= 要素 =========
  const el = {
    dataset: document.querySelector("#dataset"),
    sid:     document.querySelector("#sid"),
    yes:     document.querySelector("#ps"),
    no:      document.querySelector("#cs"),
    step:    document.querySelector("#rd"),
    res:     document.querySelector("#result"),
    img:     document.querySelector("#image_place"),
    log:     document.querySelector("#log"),
    reset:   document.querySelector("#reset"),
    undo:    document.querySelector("#undo"),
    choices: Array.from(document.querySelectorAll(".choice")),
  };

  function esc(s){
    return String(s ?? "").replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function logLine(t){
    const time = new Date().toLocaleTimeString();
    el.log.innerHTML = `<div>[${time}] ${esc(t)}</div>` + el.log.innerHTML;
  }

  function setLoading(loading) {
    el.reset.disabled = loading;
    el.undo.disabled  = loading || !gameActive;
    el.choices.forEach(b => b.disabled = loading || !gameActive);
    el.dataset.disabled = loading || gameActive; // ゲーム中はデータセット固定
  }

  // ========= API通信ラッパ =========
  async function apiRequest(url, payload, method = "POST") {
    setLoading(true);
    try {
      const options = {
        method,
        credentials: "include",
        headers: {}
      };
      if (method !== "GET") {
        options.headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(payload || {});
      }
      const response = await fetch(url, options);
      if (!response.ok) {
        throw new Error(`APIエラー: ${response.status} ${response.statusText}`);
      }
      return await response.json();
    } catch (err) {
      console.error("通信エラー:", err);
      el.res.innerHTML =
        `エラー: サーバー(${API_BASE})に接続できません。<br>` +
        `Flaskサーバー(app.py)が起動しているか確認してください。`;
      gameActive = false;
      return null;
    } finally {
      setLoading(false);
    }
  }

  // ========= データセット一覧取得 =========
  async function loadDatasets() {
    const data = await apiRequest(API_DATASETS, null, "GET");
    if (!data || !data.datasets) {
      el.dataset.innerHTML = `<option value="">(データセットなし)</option>`;
      el.dataset.disabled = true;
      logLine("データセット候補が見つかりません。");
      return;
    }
    if (data.datasets.length === 0) {
      el.dataset.innerHTML = `<option value="">(データセットなし)</option>`;
      el.dataset.disabled = true;
      logLine("データセット候補が見つかりません。");
      return;
    }

    el.dataset.innerHTML = "";
    let defaultId = null;
    for (const d of data.datasets) {
      const opt = document.createElement("option");
      opt.value = d.id;
      opt.textContent = d.label + (d.is_default ? "（最新）" : "");
      el.dataset.appendChild(opt);
      if (d.is_default) defaultId = d.id;
    }
    if (defaultId) el.dataset.value = defaultId;
    logLine(`データセット候補を読み込みました (${data.datasets.length}件)。`);
  }

  // ========= セッション開始 =========
  async function startSession() {
    if (!el.dataset.value) {
      logLine("データセットが選択されていません。");
      return;
    }
    el.log.innerHTML = "";
    logLine(`新規セッション開始（dataset=${el.dataset.value}）...`);
    gameActive = true;
    currentQuestionKey = null;
    el.img.style.display = "none";

    const payload = { dataset_id: el.dataset.value };
    const data = await apiRequest(API_START, payload);
    if (data) {
      updateUI(data);
    }
  }

  // ========= 回答適用 =========
  async function applyAnswer(answer) {
    if (!gameActive) return;

    if (!currentQuestionKey && answer !== "dont_know") {
      logLine("ゲームが終了しています。「新規開始」を押してください。");
      return;
    }

    logLine(`回答 (${answer}) → ${el.res.textContent.substring(0, 20)}...`);

    const payload = {
      answer: answer,
      question_key: currentQuestionKey,
    };

    const data = await apiRequest(API_ANSWER, payload);
    if (data) {
      updateUI(data);
    }
  }

  // ========= 1つ戻る =========
  async function undoLast() {
    if (!gameActive) return;
    logLine("1つ前の状態に戻ります...");
    const data = await apiRequest(API_UNDO, {});
    if (data) {
      if (data.undo) {
        logLine("直前の回答を取り消しました。");
      } else {
        logLine("戻れる履歴がありません。");
      }
      updateUI(data);
    }
  }

  // ========= 描画更新 =========
  function updateUI(data) {
    if (!data) return;

    // 統計
    if (data.session_data) {
      el.sid.textContent  = data.session_data.sid;
      el.yes.textContent  = data.session_data.yes;
      el.no.textContent   = data.session_data.no;
      el.step.textContent = data.session_data.steps;
    }

    // データセットIDが返ってきていたらセレクトを同期（他タブ対策）
    if (data.dataset_id && el.dataset.value !== data.dataset_id) {
      el.dataset.value = data.dataset_id;
    }

    if (data.type === "question") {
      el.res.innerHTML = `Q${(data.session_data.steps || 0) + 1}: ${esc(data.question_text)}`;
      currentQuestionKey = data.question_key;
      gameActive = true;
      logLine(`質問 → ${data.question_text}`);
    } else if (data.type === "guess") {
      const conf = parseFloat(data.confidence || 0).toFixed(0);
      el.res.innerHTML =
        `推測：<b>${esc(data.name)}</b><br>` +
        `（候補 ${data.candidates_count}人, 確信度 ${conf}%）`;
      currentQuestionKey = null;
      // 推測後でも「1つ戻る」でやり直せるように一旦 true のままにする
      gameActive = true;
      logLine(`推測 → ${data.name} (確信度 ${conf}%)`);
    }

    setLoading(false);
  }

  // ========= イベント =========
  el.reset.addEventListener("click", startSession);
  el.undo.addEventListener("click", undoLast);
  el.choices.forEach(b => b.addEventListener("click", () => applyAnswer(b.dataset.a)));

  // 初期状態
  gameActive = false;
  setLoading(false);
  loadDatasets(); // 起動時にデータセット候補を取得
})();
</script>
</body>
</html>
