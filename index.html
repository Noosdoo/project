<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AI Akinator Clone</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg-dark: #0f172a; --glass: rgba(30, 41, 59, 0.8); }
  body {
    margin: 0; font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg-dark); color: #f1f5f9;
    display: flex; justify-content: center; align-items: center; min-height: 100vh;
  }
  .card {
    background: var(--glass); padding: 40px; border-radius: 24px;
    width: 90%; max-width: 600px; text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.1);
  }
  h1 { background: linear-gradient(to right, #60a5fa, #c084fc); -webkit-background-clip: text; color: transparent; margin: 0 0 20px 0; }
  .question { font-size: 1.5rem; font-weight: bold; margin: 30px 0; min-height: 80px; }
  
  /* プルダウンのスタイル */
  select {
    padding: 10px; font-size: 1rem; border-radius: 10px;
    background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.3);
    margin-bottom: 20px; width: 80%; cursor: pointer;
  }
  option { background: #0f172a; color: white; }

  button {
    border: none; padding: 15px 30px; border-radius: 50px;
    font-size: 1rem; font-weight: bold; cursor: pointer; margin: 5px;
    transition: transform 0.1s; color: white;
  }
  button:active { transform: scale(0.95); }
  .btn-yes { background: #10b981; }
  .btn-no { background: #ef4444; }
  .btn-unk { background: #64748b; }
  .btn-start { background: linear-gradient(135deg, #3b82f6, #8b5cf6); font-size: 1.5rem; padding: 20px 50px; }
  .hidden { display: none; }
  img { max-width: 200px; border-radius: 10px; margin: 20px 0; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
</style>
</head>
<body>

<div class="card">
  <header>
    <h1>AI GUESSER</h1>
    <div style="color:#94a3b8">Turn <span id="step">0</span></div>
  </header>

  <div id="game-area">
    <div id="start-screen">
      <p>データセットを選択してください</p>
      
      <select id="dataset-select">
        <option>読み込み中...</option>
      </select>
      <br>

      <button onclick="startGame()" class="btn-start">GAME START</button>
    </div>

    <div id="play-screen" class="hidden">
      <div class="question" id="q-text">質問読み込み中...</div>
      <div>
        <button class="btn-yes" onclick="answer('yes')">YES</button>
        <button class="btn-unk" onclick="answer('dont_know')">???</button>
        <button class="btn-no" onclick="answer('no')">NO</button>
      </div>
      <div style="margin-top:20px">
        <button onclick="undo()" style="background:transparent; border:1px solid #475569; font-size:0.8rem">1つ戻る</button>
      </div>
    </div>

    <div id="result-screen" class="hidden">
      <div id="result-content"></div>
      <button onclick="location.reload()" class="btn-start" style="font-size:1rem; margin-top:20px">もう一度遊ぶ</button>
    </div>
  </div>
</div>

<script>
const API_BASE = "http://127.0.0.1:5001";
let currentKey = null;

// 起動時にデータセット一覧を取得
window.onload = async function() {
  const data = await api('/datasets', {}, 'GET');
  if (data && data.datasets) {
    const select = document.getElementById('dataset-select');
    select.innerHTML = ''; // クリア
    
    if (data.datasets.length === 0) {
       select.innerHTML = '<option>データファイルがありません</option>';
       return;
    }

    data.datasets.forEach(ds => {
      const option = document.createElement('option');
      option.value = ds.id;
      option.textContent = ds.label;
      select.appendChild(option);
    });
  }
};

async function api(path, body={}, method='POST') {
  try {
    const options = {
      method: method,
      headers: {'Content-Type': 'application/json'}
    };
    if (method !== 'GET') {
      options.body = JSON.stringify(body);
    }
    
    const res = await fetch(API_BASE + path, options);
    if(!res.ok) throw new Error(await res.text());
    return await res.json();
  } catch(e) {
    alert("エラー: " + e.message);
  }
}

async function startGame() {
  const select = document.getElementById('dataset-select');
  const selectedId = select.value;
  
  // 選択されたIDを送る
  const data = await api('/start', { dataset_id: selectedId });
  if(data) updateUI(data);
}

async function answer(ans) {
  const data = await api('/answer', { answer: ans, question_key: currentKey });
  if(data) updateUI(data);
}

async function undo() {
  const data = await api('/undo');
  if(data && data.undo) updateUI(data);
}

function updateUI(data) {
  document.getElementById('start-screen').classList.add('hidden');
  
  if (data.type === 'question') {
    document.getElementById('play-screen').classList.remove('hidden');
    document.getElementById('q-text').textContent = data.question_text;
    document.getElementById('step').textContent = data.session_data.steps;
    currentKey = data.question_key;
    
  } else if (data.type === 'guess') {
    document.getElementById('play-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');
    
    let html = `<h2>推測: ${data.name}</h2>`;
    if(data.image) html += `<img src="${data.image}">`;
    html += `<p>確信度: ${data.confidence}%</p>`;
    document.getElementById('result-content').innerHTML = html;
  }
}
</script>
</body>
</html>
